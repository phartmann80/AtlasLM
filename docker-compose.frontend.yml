name: atlaslm_frontend

services:
  frontend:
    image: ${ATLAS_FRONTEND_IMAGE:?ATLAS_FRONTEND_IMAGE must be set}
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY must be set}
        NEXT_PUBLIC_API_BASE: /api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATLAS_BACKEND_URL: ${ATLAS_FRONTEND_BACKEND_URL:-https://api.atlaslm.cloud}
      ATLAS_GATEWAY_NAME: self-hosted
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY must be set}
      NEXT_PUBLIC_API_BASE: /api/v1
    ports:
      - "127.0.0.1:${ATLAS_FRONTEND_PORT:-3010}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
